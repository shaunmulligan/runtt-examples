# Sysbuild configuration shared by every image that ships.
#
# firmware/app/sysbuild.conf and firmware/idle/sysbuild.conf are symlinks to
# this file. Sysbuild auto-discovers sysbuild.conf per application, so each app
# needs one -- but the signing key and swap mode must be identical across them,
# and two copies would eventually disagree in a way nothing would catch until a
# board refused to boot.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Pin the swap mode rather than inheriting the default. It changed to
# swap-using-offset recently, and a bootloader built for one mode cannot boot an
# image built for the other (zephyr#98050). Since sysbuild builds both together
# they always agree here, but a Zephyr bump must not silently change the
# on-device contract.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# ---------------------------------------------------------------------------
# SIGNING: development only. Do not ship this.
# ---------------------------------------------------------------------------
# Stated explicitly rather than left to the default, because the default is
# dangerous in a way that looks fine: sysbuild silently selects RSA-2048 with
# MCUboot's own root-rsa-2048.pem, and that file is the PRIVATE key, committed
# in the public MCUboot repository.
#
# The consequence is not subtle. Flashing MCUboot is what enrols the trust root:
# the embedded key defines whose firmware the board will ever accept. With a
# publicly known private key, no trust is enrolled at all -- anyone who can
# reach the SMP transport can push firmware the bootloader will happily verify
# and boot. `imgtool verify` will even report "Image was correctly validated",
# which is exactly why this needs saying out loud.
#
# For the PoC that is an accepted, deliberate trade. Before any fleet:
#   * generate a per-fleet key pair and keep the private half out of the repo;
#   * point SB_CONFIG_BOOT_SIGNATURE_KEY_FILE at it via the build environment;
#   * remember the public half is baked into MCUboot at provisioning time, so
#     rotating it means re-flashing over SWD -- key management is a
#     provisioning decision, not a build-time one.
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
