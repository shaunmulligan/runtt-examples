name: CI

on:
  push:
  pull_request:

env:
  ZEPHYR_SDK_VERSION: 1.0.1
  # Every toolchain the board list needs. This job's matrix comes from
  # runtt-boards' boards.yml, so a board promoted THERE lands here with no edit
  # to this file -- which is the point, and also why this list has to be kept in
  # step with that one. ARM covers RP2040, RP2350 and nRF52840; Xtensa covers
  # the ESP32-S3.
  ZEPHYR_SDK_TOOLCHAINS: arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf

jobs:
  # ---------------------------------------------------------------------------
  # Build both example applications for every supported board.
  #
  # NOT through their Dockerfiles, which is what these directories are really
  # for, and that gap is deliberate rather than overlooked. The Dockerfiles start
  # FROM runtt-builder, which builds FROM zephyrprojectrtos/ci -- an image
  # carrying a toolchain for every architecture Zephyr supports, ~33 GB, more
  # than a GitHub runner has free. runtt-boards' CI hit exactly that and dropped
  # the container.
  #
  # So this builds the same sources the same way the Dockerfile does -- same
  # board targets, same snippet flag -- from a west workspace. What it does not
  # prove is that the Dockerfile itself works. Making runtt-boards' builder image
  # slim enough to build here (a plain base plus `west sdk install -t
  # arm-zephyr-eabi`, ~3 GB rather than 33) would close that, and is tracked in
  # runtt's roadmap.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    env:
      RUNTT_BOARDS_REF: main
    steps:
      - name: Check out the examples
        uses: actions/checkout@v4
        with:
          path: examples

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west and build tools
        run: |
          pip install --quiet west pyelftools cryptography intelhex click cbor2 jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build device-tree-compiler

      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            boards
            .west
          key: west-${{ env.RUNTT_BOARDS_REF }}-${{ hashFiles('examples/.github/workflows/ci.yml') }}

      - name: Assemble a workspace from runtt-boards
        run: |
          west init -m https://github.com/shaunmulligan/runtt-boards \
                    --mr "${RUNTT_BOARDS_REF}" . 2>/dev/null || echo "already initialised"
          west update --narrow -o=--depth=1
          pip install --quiet -r zephyr/scripts/requirements-base.txt
          # AND every MODULE's declared requirements, which is a different set.
          # hal_espressif declares `esptool`, and Zephyr's Espressif SoC CMake
          # wraps `find_program(esptool)` in a FATAL_ERROR -- so without it the
          # ESP32-S3 fails at CONFIGURE ("Configuring incomplete"), which reads
          # like a broken board port rather than a missing host package.
          #
          # Driven by `west packages` so the next module's requirement arrives
          # on its own. Zephyr's aggregate requirements.txt is filtered out: it
          # pulls the doc, compliance and test extras, and requirements-base
          # above is the part a firmware build needs.
          reqs=$(west packages pip | grep -v 'zephyr/scripts/requirements.txt' || true)
          if [ -n "${reqs}" ]; then
            echo "module requirements: ${reqs}"
            # Word splitting is intended: a list of `-r <path>` pairs.
            # shellcheck disable=SC2086
            pip install --quiet ${reqs}
          fi

      # THE KEY UNDERSTATES WHAT THIS HOLDS, deliberately: it is ARM plus
      # Xtensa. A key naming both would address nothing, so the install below
      # would fetch the whole SDK cold instead of the one missing toolchain --
      # which is how the same rename broke runtt-boards' ARM build. The step
      # below verifies contents, so correctness does not rest on this string.
      - name: Cache the Zephyr SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm

      # CHECK WHAT THE CACHE HOLDS, rather than trusting a hit. This step was
      # `if: cache-hit != 'true'` and installed ARM alone. When the ESP32-S3 was
      # promoted in runtt-boards, this job's matrix picked it up -- correctly --
      # and then failed: the key was unchanged, so the restore hit an ARM-only
      # cache, this step was skipped, and the board had no compiler. Verifying
      # presence is self-healing where a corrected key fixes one instance.
      - name: Install the toolchains the board list needs
        run: |
          set -euo pipefail
          sdk="zephyr-sdk-${ZEPHYR_SDK_VERSION}"
          missing=""
          for t in ${ZEPHYR_SDK_TOOLCHAINS}; do
            # Toolchains live under gnu/; tolerate a flat layout rather than
            # depending on that detail.
            if [ ! -d "${sdk}/gnu/${t}" ] && [ ! -d "${sdk}/${t}" ]; then
              missing="${missing} ${t}"
            fi
          done
          if [ -z "${missing}" ]; then
            echo "  cache already has:${ZEPHYR_SDK_TOOLCHAINS// /, }"
            exit 0
          fi
          echo "  missing from the cache:${missing}"
          args=""
          for t in ${ZEPHYR_SDK_TOOLCHAINS}; do args="${args} -t ${t}"; done
          # shellcheck disable=SC2086
          west sdk install --version "${ZEPHYR_SDK_VERSION}" \
            --install-base "${GITHUB_WORKSPACE}" ${args}
          du -sh "${sdk}"

      - name: Point Zephyr at it
        run: echo "ZEPHYR_SDK_INSTALL_DIR=${GITHUB_WORKSPACE}/zephyr-sdk-${ZEPHYR_SDK_VERSION}" >> "$GITHUB_ENV"

      # The board list comes from boards.yml, so adding a board there covers it
      # here with no edit to this file. Fetched in its own step: a heredoc nested
      # inside a YAML block scalar has to stay indented past the block, which is
      # easy to get wrong and fails as a YAML parse error rather than a build one.
      - name: Which boards are supported
        run: |
          python3 -c "
          import json, urllib.request
          u = 'https://raw.githubusercontent.com/shaunmulligan/runtt-boards/main/boards.json'
          with urllib.request.urlopen(u, timeout=60) as r:
              ids = [b['id'] for b in json.load(r)['boards'] if b['status'] == 'supported']
          print('\n'.join(ids))
          " | tee supported-boards.txt
          test -s supported-boards.txt

      # Every app against every supported board.
      #
      # The snippet flag is -D<image>_SNIPPET, and the image name comes from the
      # SOURCE DIRECTORY -- app1_SNIPPET for app1, app2_SNIPPET for app2. Getting
      # that wrong is silent: sysbuild ignores a flag naming an image that does
      # not exist and exits zero, leaving firmware with no runtt module in it.
      # That is exactly what happened in runtt-boards, and it is why the descriptor
      # check below exists rather than trusting the build's exit status.
      # WHEN A BUILD FAILS, SAY WHAT THE ENVIRONMENT WAS. Both faults this job
      # has hit were environment facts -- a cache holding one toolchain, a
      # runner without esptool -- that the build reported only obliquely.
      # ::error:: lands it in the run's annotations, readable without logs.
      - name: What the environment looked like, on failure
        if: failure()
        run: |
          sdk="zephyr-sdk-${ZEPHYR_SDK_VERSION}"
          echo "::error title=SDK toolchains::$(ls "${sdk}/gnu" 2>/dev/null | tr '\n' ' ' || echo "NO ${sdk}/gnu")"
          echo "::error title=host packages::$(pip list 2>/dev/null | grep -iE '^(esptool|imgtool|west|cbor|cryptography|intelhex) ' | tr '\n' ' ')"
          echo "::error title=esptool on PATH::$(command -v esptool || echo ABSENT)"
          echo "::error title=boards built for::$(tr '\n' ' ' < supported-boards.txt 2>/dev/null || echo unknown)"

      - name: Build every example for every supported board
        run: |
          set -euo pipefail
          while read -r board; do
            [ -n "$board" ] || continue
            safe="${board//\//_}"
            for app in examples/app1 examples/app2; do
              name="$(basename "$app")"
              echo "::group::$name on $board"
              west build -p always -b "$board" --sysbuild "$app" \
                -d "build-${name}-${safe}" -- "-D${name}_SNIPPET=runtt"
              echo "::endgroup::"
            done
          done < supported-boards.txt

      - name: The contract is in the built images
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for cfg in build-*/*/zephyr/.config; do
            grep -q "^CONFIG_RUNTT_USB=y" "$cfg" || continue
            elf="$(dirname "$cfg")/zephyr.elf"
          # strings(1) into a file, then grep the FILE. Not `strings ... | grep -q`:
          # grep -q exits on the first match and closes the pipe, strings dies of
          # SIGPIPE, and under `set -o pipefail` the pipeline reports failure
          # BECAUSE the descriptor was found. That inverts this check -- it passes
          # only when the contract is missing. Caught by running it with pipefail
          # on, having written it and tested it without.
            syms="$(mktemp)"
            strings "$elf" > "$syms"
            for iface in runtt-mgmt runtt-log; do
              grep -qx "$iface" "$syms" \
                || { echo "::error::$elf lacks the $iface descriptor"; exit 1; }
            done
            rm -f "$syms"
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ] || { echo "::error::no USB images built"; exit 1; }
          echo "checked $checked image(s)"

      - name: Upload the signed images
        uses: actions/upload-artifact@v4
        with:
          name: ci-example-images
          path: build-*/*/zephyr/zephyr.signed.bin
          retention-days: 14
